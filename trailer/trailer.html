<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VITAP Connect Trailer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face { font-family: Brico; src: url(fonts/brico.woff2) format("woff2"); font-weight: 200 800; }
@font-face { font-family: Plex; src: url(fonts/plex-400.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: Plex; src: url(fonts/plex-500.woff2) format("woff2"); font-weight: 500; }
@font-face { font-family: Plex; src: url(fonts/plex-600.woff2) format("woff2"); font-weight: 600; }
@font-face { font-family: Mono; src: url(fonts/mono-400.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: Mono; src: url(fonts/mono-500.woff2) format("woff2"); font-weight: 500; }

:root {
  --paper: #F5F3EE; --ink: #17160F; --ink2: #5E5A50; --ink3: #8D887C; --line: #E2DED4;
  --night: #121110; --surface-d: #1B1A17; --line-d: #2E2C28; --ink2-d: #A8A396;
  --accent: #D9480F; --accent2: #FF7A45; --accent-soft: #FCE8DD; --ok: #2F7D4F; --ok-d: #68C48D; --bad: #BE3126;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
#wrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
#stage { position: absolute; inset: 0; overflow: hidden; background: var(--night); font-family: Plex, sans-serif; color: var(--paper); }
#cam { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; display: none; overflow: hidden; }
.abs { position: absolute; }
.acc { color: var(--accent); }
.acc2 { color: var(--accent2); }
.mono { font-family: Mono, monospace; letter-spacing: .18em; text-transform: uppercase; }
.disp { font-family: Brico, sans-serif; font-weight: 700; letter-spacing: -.045em; line-height: .98; }
.eyebrow { font: 500 22px/1 Mono, monospace; letter-spacing: .22em; text-transform: uppercase; }
.eyebrow b { color: var(--accent); font-weight: 500; }

/* cold open */
.slam { position: absolute; left: 0; right: 0; top: 450px; text-align: center; font: 700 150px/180px Brico; letter-spacing: -.05em; color: var(--paper); opacity: 0; }
.dotgrid { position: absolute; inset: -40px; background-image: radial-gradient(rgba(245,243,238,.16) 1.4px, transparent 1.6px); background-size: 48px 48px; }

/* logo */
.wm { font: 700 150px/1 Brico; letter-spacing: -.05em; white-space: nowrap; }
.wm span { display: inline-block; opacity: 0; }

/* browser frame */
.frame { position: absolute; border-radius: 20px; overflow: hidden; background: #fff; box-shadow: 0 50px 120px -30px rgba(23,22,15,.45), 0 0 0 1px rgba(23,22,15,.08); }
.frame .bar { height: 52px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 0 22px; }
.frame .bar i { width: 13px; height: 13px; border-radius: 50%; background: var(--line); display: block; }
.frame .url { margin-left: 20px; flex: 1; max-width: 560px; height: 32px; border-radius: 9px; background: #F1EEE7; color: var(--ink3); font: 400 16px/32px Mono; padding-left: 16px; letter-spacing: .02em; }
.frame .vp { position: relative; overflow: hidden; }
.frame .zoom { position: absolute; left: 0; top: 0; }
.nat { position: absolute; left: 0; top: 0; width: 2160px; height: 1350px; transform-origin: 0 0; }
.nat img { position: absolute; left: 0; top: 0; width: 2160px; height: 1350px; display: block; }
.ring { position: absolute; border: 6px solid var(--accent); border-radius: 18px; opacity: 0; }
.callout { position: absolute; background: var(--ink); color: var(--paper); font: 500 30px/1 Plex; padding: 18px 26px; border-radius: 14px; white-space: nowrap; opacity: 0; box-shadow: 0 20px 40px -10px rgba(0,0,0,.35); }
.callout::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--accent2); margin-right: 14px; vertical-align: 3px; }

/* app-like UI */
.panel { position: absolute; background: #fff; border: 1px solid var(--line); border-radius: 24px; color: var(--ink); box-shadow: 0 40px 90px -40px rgba(23,22,15,.35); }
.tag { display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 10px; background: #EDEAE3; color: var(--ink2); font: 500 21px/1 Plex; margin-right: 10px; }
.tag.acc { background: var(--accent-soft); color: var(--accent); }
.av { display: inline-flex; align-items: center; justify-content: center; border-radius: 14px; font: 500 22px/1 Plex; letter-spacing: .02em; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 54px; padding: 0 26px; border-radius: 13px; font: 500 22px/1 Plex; }
.btn.ink { background: var(--ink); color: var(--paper); }
.btn.out { border: 1.5px solid #CDC8BB; color: var(--ink); }

/* chat */
.bub { position: absolute; font: 400 30px/1.3 Plex; padding: 15px 26px; border-radius: 20px; white-space: nowrap; opacity: 0; }
.bub.in { left: 40px; background: #23211E; border: 1px solid var(--line-d); color: var(--paper); transform-origin: 0 50%; border-bottom-left-radius: 6px; }
.bub.out { right: 40px; background: #F2EFE8; color: var(--ink); transform-origin: 100% 50%; border-bottom-right-radius: 6px; }
.bub .tk { display: inline-block; margin-left: 12px; font: 500 20px/1 Mono; color: #8D887C; letter-spacing: -.25em; }
.feat { position: absolute; left: 0; display: flex; align-items: center; gap: 22px; font: 400 32px/1 Plex; color: var(--paper); opacity: 0; white-space: nowrap; }
.feat .ic { width: 58px; height: 58px; border-radius: 14px; border: 1px solid var(--line-d); background: var(--surface-d); display: flex; align-items: center; justify-content: center; }

/* call */
.tile { position: absolute; border-radius: 22px; overflow: hidden; opacity: 0; }
.tile .nm { position: absolute; left: 18px; bottom: 18px; background: rgba(0,0,0,.45); color: #fff; font: 500 20px/1 Plex; padding: 10px 14px; border-radius: 10px; }
.tile .bars { position: absolute; right: 20px; bottom: 22px; display: flex; gap: 5px; align-items: flex-end; height: 30px; }
.tile .bars i { width: 6px; background: #fff; border-radius: 3px; display: block; }
.tile .ini { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 600 40px/1 Plex; color: #fff; background: rgba(255,255,255,.14); }
.tile .spk { position: absolute; inset: 0; border: 5px solid var(--accent2); border-radius: 22px; opacity: 0; }
.cbtn { width: 76px; height: 76px; border-radius: 50%; background: #2A2825; display: flex; align-items: center; justify-content: center; }

/* phones */
.phone { position: absolute; width: 330px; height: 686px; border-radius: 52px; background: #0B0A09; padding: 12px; box-shadow: 0 60px 120px -30px rgba(0,0,0,.7), inset 0 0 0 2px #2b2926; opacity: 0; }
.phone .scr { width: 306px; height: 662px; border-radius: 41px; overflow: hidden; position: relative; }
.phone img { width: 306px; display: block; }
.phone .notch { position: absolute; left: 50%; top: 22px; width: 96px; height: 28px; margin-left: -48px; border-radius: 16px; background: #0B0A09; }

/* stack */
.box { position: absolute; width: 400px; height: 104px; border-radius: 16px; background: var(--surface-d); border: 1px solid #3a3733; padding: 18px 24px; opacity: 0; }
.box b { display: block; font: 700 36px/1 Brico; letter-spacing: -.03em; color: var(--paper); }
.box span { display: block; margin-top: 12px; font: 400 17px/1 Mono; letter-spacing: .06em; color: var(--ink2-d); text-transform: uppercase; }
.box.hl { border-color: var(--accent2); }

/* overlays */
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#grain { position: absolute; inset: 0; opacity: .07; mix-blend-mode: overlay; pointer-events: none; }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.28) 100%); }
#hud { position: absolute; inset: 0; pointer-events: none; font: 500 16px/1 Mono; letter-spacing: .22em; text-transform: uppercase; opacity: 0; }
#hud div { position: absolute; }
#cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; pointer-events: none; display: none; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
#play { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #fff; font: 500 18px Mono; letter-spacing: .2em; cursor: pointer; background: rgba(0,0,0,.5); }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><div id="cam"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.6 14.8 L11.6 21.4 L14.4 20.2 L11.4 13.7 L17.6 13.4 Z" fill="#fff" stroke="#17160F" stroke-width="1.4" stroke-linejoin="round"/></svg>
  <canvas id="grain" width="960" height="540"></canvas>
  <div id="vig"></div>
  <div id="hud">
    <div id="hud-tl" style="left:56px;top:48px">VITAP<span class="acc">/</span>Connect</div>
    <div id="hud-tr" style="right:56px;top:48px">00:00:00</div>
    <div id="hud-bl" style="left:56px;bottom:46px"></div>
    <div id="hud-br" style="right:56px;bottom:46px">Product film · 2026</div>
  </div>
  <div id="flash"></div>
</div></div>
<div id="play">▶&nbsp;&nbsp;CLICK TO PLAY WITH SOUND</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Everything is a pure function of time t (seconds) so the film can be rendered
// frame-by-frame. window.seek(t) draws one frame.
// ─────────────────────────────────────────────────────────────────────────────
const DUR = 60;
const PAPER = "#F5F3EE", INK = "#17160F", NIGHT = "#121110", ACC = "#D9480F", ACC2 = "#FF7A45";

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const ei = (x) => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10));
const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const ec = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const mix = (c1, c2, x) => { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16); const ch = (s) => Math.round(lerp((a >> s) & 255, (b >> s) & 255, x)); return `rgb(${ch(16)},${ch(8)},${ch(0)})`; };

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function mk(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; }
function tf(el, o = {}) {
  const { x = 0, y = 0, s = 1, r = 0, rx, ry, op, blur } = o;
  const sx = o.sx ?? s, sy = o.sy ?? s;
  el.style.transform = `translate(${x}px,${y}px)${rx != null ? ` rotateX(${rx}deg)` : ""}${ry != null ? ` rotateY(${ry}deg)` : ""} rotate(${r}deg) scale(${sx},${sy})`;
  if (op != null) el.style.opacity = op;
  if (blur != null) el.style.filter = blur > 0.1 ? `blur(${blur.toFixed(2)}px)` : "none";
}
function posIn(el, root) { let x = 0, y = 0, n = el; while (n && n !== root) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; } return { x, y, w: el.offsetWidth, h: el.offsetHeight, cx: x + el.offsetWidth / 2, cy: y + el.offsetHeight / 2 }; }
function typeText(str, t, a, b) { return str.slice(0, Math.round(str.length * p(t, a, b))); }

const stage = $("#stage"), cam = $("#cam");
const scenes = [];
function addScene(start, end, bg, html, update, init) {
  const el = mk(`<div class="scene" style="background:${bg}">${html}</div>`);
  cam.appendChild(el);
  const sc = { start, end, el, update, init };
  scenes.push(sc);
  return sc;
}

// shared cursor
const cursorEl = $("#cursor");
let cursorState = null;
function cursor(x, y, down = 0) { cursorState = { x, y, down }; }

// browser-frame builder
function frameHTML(id, src, url, W, extra = "") {
  const k = W / 2160, H = Math.round(1350 * k);
  return `<div class="frame" id="${id}" style="width:${W}px">
    <div class="bar"><i></i><i></i><i></i><div class="url">${url}</div></div>
    <div class="vp" style="height:${H}px"><div class="zoom" style="width:${W}px;height:${H}px">
      <div class="nat" style="transform:scale(${k})"><img src="${src}">${extra}</div>
    </div></div></div>`;
}
const box = (x1, y1, x2, y2) => `left:${x1}px;top:${y1}px;width:${x2 - x1}px;height:${y2 - y1}px`;
const icon = {
  lock: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="${ACC2}" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg>`,
  dots: `<svg width="30" height="30" viewBox="0 0 24 24" fill="${PAPER}"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>`,
  ticks: `<svg width="32" height="30" viewBox="0 0 28 24" fill="none" stroke="${PAPER}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13l5 5L18 6"/><path d="M11 17l1.5 1.5L24 6"/></svg>`,
  group: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="${PAPER}" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/></svg>`,
  phone: (c = PAPER, s = 30) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>`,
  video: (c = PAPER, s = 30) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M22 8l-6 4 6 4z"/></svg>`,
  mic: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>`,
  screen: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>`,
  hang: `<svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M12 9c-3.2 0-6.2.9-8.8 2.6-.7.4-.9 1.3-.6 2l1 2c.3.7 1.1 1 1.8.7l2.4-1c.6-.3.9-.9.8-1.5l-.2-1.4C9.6 11.8 10.8 11.6 12 11.6s2.4.2 3.6.8l-.2 1.4c-.1.6.2 1.2.8 1.5l2.4 1c.7.3 1.5 0 1.8-.7l1-2c.3-.7.1-1.6-.6-2C18.2 9.9 15.2 9 12 9z"/></svg>`
};

// ═══ SCENE 1 · cold open (0–5) ═══════════════════════════════════════════════
addScene(0, 5, NIGHT, `
  <div class="dotgrid" id="c-grid"></div>
  <div class="slam" id="c1">Hackathon in 3 weeks.</div>
  <div class="slam" id="c2">Team of <span class="acc2">one.</span></div>
  <div class="slam" id="c3">Sound familiar?</div>
  <div class="abs mono" id="c0" style="left:0;right:0;top:880px;text-align:center;font-size:20px;letter-spacing:.34em;color:rgba(245,243,238,.45)">VIT-AP University · Amaravati</div>
`, (lt, t, root) => {
  const grid = $("#c-grid", root);
  tf(grid, { s: 1 + t * 0.02, op: 0.5 * p(t, 0, 1.2) * (1 - p(t, 4.3, 4.6)) });
  $("#c0", root).style.opacity = p(t, 0.2, 0.9) * (1 - p(t, 2.9, 3.1));
  const slam = (el, a, b) => {
    if (t < a || t >= b) { el.style.opacity = 0; return; }
    const k = eo(p(t, a, a + 0.3)), out = p(t, b - 0.12, b);
    tf(el, { s: lerp(1.8, 1, k) + (t - a) * 0.035 + out * 0.2, op: Math.min(1, k * 4) * (1 - out), blur: (1 - k) * 16 + out * 10 });
  };
  slam($("#c1", root), 0.5, 1.75);
  slam($("#c2", root), 1.75, 3.0);
  const c3 = $("#c3", root);
  slam(c3, 3.0, 4.62);
  if (t > 3.9 && t < 4.62) {
    const f = Math.floor(t * 60), g = p(t, 3.9, 4.62);
    const dx = (hash(f) - 0.5) * 60 * g, sk = (hash(f + 3) - 0.5) * 20 * g;
    c3.style.textShadow = `${12 + 30 * g}px 0 rgba(255,40,40,.85), ${-12 - 30 * g}px 0 rgba(30,220,255,.85)`;
    c3.style.transform += ` translateX(${dx}px) skewX(${sk}deg)`;
    if (hash(f + 9) < 0.25 + g * 0.4) c3.style.opacity = 0.15;
    c3.style.clipPath = hash(f + 5) < 0.5 ? `inset(${hash(f + 1) * 60}% 0 ${hash(f + 2) * 30}% 0)` : "none";
  } else { c3.style.textShadow = "none"; c3.style.clipPath = "none"; }
});

// ═══ SCENE 2 · logo reveal (5–9) ═════════════════════════════════════════════
{
  const wmHTML = "VITAP/Connect".split("").map((c) => `<span${c === "/" ? ' class="acc2"' : ""}>${c}</span>`).join("");
  addScene(5, 9, NIGHT, `
  <div id="lg" class="abs" style="left:0;top:0;width:1920px;height:1080px;transform-origin:541.9px 519.4px">
    <div id="lgw" class="abs" style="left:660px;top:240px;width:600px;height:600px">
      <svg viewBox="0 0 32 32" width="600" height="600" style="overflow:visible">
        <rect id="lrect" width="32" height="32" rx="7" fill="${PAPER}" style="transform-origin:16px 16px;transform-box:view-box"/>
        <g id="lghost"></g>
        <path id="ltri" d="M11 11 L22 14 L13 22 Z" fill="none" stroke="${PAPER}" stroke-width="1.4" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/>
        <circle id="d1" r="3.2" fill="${PAPER}"/><circle id="d2" r="3.2" fill="${ACC}"/><circle id="d3" r="3.2" fill="${PAPER}"/>
      </svg>
    </div>
    <div id="wm" class="abs wm" style="left:690px;top:472px;font-size:128px">${wmHTML}</div>
    <div id="ltag" class="abs mono" style="left:694px;top:628px;font-size:24px;letter-spacing:.24em;color:rgba(245,243,238,.6)"></div>
  </div>`, (lt, t, root) => {
    const targets = [[11, 11], [22, 14], [13, 22]], from = [[-58, -30], [90, -6], [-20, 70]];
    const ghost = $("#lghost", root);
    let g = "";
    targets.forEach(([tx, ty], i) => {
      const at = (tt) => { const k = eo(p(tt, 5.0 + i * 0.12, 5.75 + i * 0.12)); return [lerp(from[i][0], tx, k), lerp(from[i][1], ty, k)]; };
      const [x, y] = at(t);
      const d = $(`#d${i + 1}`, root);
      d.setAttribute("cx", x); d.setAttribute("cy", y);
      for (let j = 1; j <= 6; j++) {
        const [gx, gy] = at(t - j * 0.025);
        g += `<circle cx="${gx}" cy="${gy}" r="${3.2 - j * 0.35}" fill="${i === 1 ? ACC2 : PAPER}" opacity="${0.32 - j * 0.045}"/>`;
      }
    });
    ghost.innerHTML = g;
    const tri = $("#ltri", root);
    tri.setAttribute("stroke-dashoffset", 1 - eio(p(t, 5.7, 6.15)));
    const rk = p(t, 6.05, 6.5), rect = $("#lrect", root);
    rect.style.transform = `scale(${back(rk) * (rk > 0 ? 1 : 0)})`;
    const inv = t >= 6.12;
    $("#d1", root).setAttribute("fill", inv ? INK : PAPER);
    $("#d3", root).setAttribute("fill", inv ? INK : PAPER);
    tri.setAttribute("stroke", inv ? INK : PAPER);
    const m = eio(p(t, 6.55, 7.15));
    const wmEl = $("#wm", root), Wm = wmEl.offsetWidth, L = 960 - (330 + 44 + Wm) / 2, TX = L + 165 - 960;
    wmEl.style.left = `${L + 374}px`; $("#ltag", root).style.left = `${L + 378}px`;
    $("#lg", root).style.transformOrigin = `${960 + TX + 61.9}px 519.4px`;
    tf($("#lgw", root), { x: TX * m, s: lerp(1, 0.55, m), r: (1 - eo(p(t, 6.05, 6.7))) * -12 });
    $$("#wm span", root).forEach((sp, i) => {
      const k = p(t, 6.8 + i * 0.04, 7.2 + i * 0.04);

    ${B.map(([b, s, x, y], i) => `<div class="box" id="bx${i}" style="left:${x}px;top:${y}px"><b>${b}</b><span>${s}</span></div>`).join("")}
  `, (lt, t, root) => {
    $("#sk-head", root).style.opacity = p(t, 49.0, 49.3);
    $$(".sk-col", root).forEach((c, i) => (c.style.opacity = p(t, 49.1 + i * 0.75, 49.3 + i * 0.75)));
    B.forEach((_, i) => {
      const k = p(t, 49.25 + i * 0.25, 49.5 + i * 0.25);
      const el = $(`#bx${i}`, root);
      tf(el, { s: k > 0 ? lerp(1.5, 1, eo(k)) : 1.5, op: k > 0 ? Math.min(1, k * 3) : 0, blur: (1 - eo(k)) * 8 });
      el.classList.toggle("hl", t > 49.25 + i * 0.25 && t < 49.6 + i * 0.25);
    });
    // connectors: client→api rows, api→data
    const L = [[610, 352, 760, 352], [610, 482, 760, 482], [610, 612, 760, 482], [1160, 352, 1310, 382], [1160, 482, 1310, 552], [1160, 612, 1310, 382]];
    const lk = eio(p(t, 51.5, 52.0));
    $("#sk-lines", root).innerHTML = L.map(([x1, y1, x2, y2]) => `<path d="M${x1} ${y1} C${x1 + 75} ${y1} ${x2 - 75} ${y2} ${x2} ${y2}" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${1 - lk}"/>`).join("");
    let pk = "";
    if (t > 51.9) L.forEach(([x1, y1, x2, y2], i) => {
      for (let q = 0; q < 2; q++) {
        const u = ((t - 51.9) * 1.4 + q * 0.5 + i * 0.17) % 1, e = u, mt = 1 - e;
        const bx = mt ** 3 * x1 + 3 * mt * mt * e * (x1 + 75) + 3 * mt * e * e * (x2 - 75) + e ** 3 * x2;
        const by = mt ** 3 * y1 + 3 * mt * mt * e * y1 + 3 * mt * e * e * y2 + e ** 3 * y2;
        pk += `<circle cx="${bx}" cy="${by}" r="5"/>`;
      }
    });
    $("#sk-pk", root).innerHTML = pk;
    const z = ei(p(t, 52.6, 53.0));
    root.style.transform = `scale(${1 - z * 0.15})`;
    root.style.opacity = 1 - z;
  });
}

// ═══ SCENE 10 · end card (53–60) ═════════════════════════════════════════════
{
  const wmHTML = "VITAP/Connect".split("").map((c) => `<span${c === "/" ? ' class="acc"' : ""}>${c}</span>`).join("");
  addScene(53, 60, PAPER, `
    <div class="dotgrid" id="e-grid" style="background-image:radial-gradient(rgba(23,22,15,.13) 1.4px,transparent 1.6px)"></div>
    <div class="abs" id="e-mark" style="left:870px;top:230px;width:180px;height:180px">
      <svg viewBox="0 0 32 32" width="180" height="180"><rect width="32" height="32" rx="7" fill="${INK}"/><path d="M11 11 L22 14 L13 22 Z" fill="none" stroke="${PAPER}" stroke-width="1.4" stroke-linejoin="round"/><circle cx="11" cy="11" r="3.2" fill="${PAPER}"/><circle cx="22" cy="14" r="3.2" fill="${ACC}"/><circle cx="13" cy="22" r="3.2" fill="${PAPER}"/></svg>
    </div>
    <div class="abs wm" id="e-wm" style="left:0;right:0;top:460px;text-align:center;color:#17160F;font-size:150px">${wmHTML}</div>
    <div class="abs disp" id="e-tag" style="left:0;right:0;top:650px;text-align:center;color:#5E5A50;font-size:50px;font-weight:500;letter-spacing:-.02em;opacity:0">Find your people. Build something.</div>
    <div class="abs mono" id="e-stack" style="left:0;right:0;top:790px;text-align:center;font-size:19px;letter-spacing:.26em;color:#8D887C;opacity:0">React · Express · Neo4j · MongoDB · Socket.io · WebRTC</div>
    <div class="abs" id="e-black" style="inset:0;background:#000;opacity:0"></div>
  `, (lt, t, root) => {
    tf($("#e-grid", root), { s: 1.1 - lt * 0.012, op: 0.8 });
    const mk_ = p(t, 53.0, 53.5);
    tf($("#e-mark", root), { s: mk_ > 0 ? back(mk_) : 0, r: (1 - eo(mk_)) * -90, op: 1 });
    $$("#e-wm span", root).forEach((sp, i) => { const k = p(t, 53.3 + i * 0.035, 53.7 + i * 0.035); tf(sp, { y: (1 - eo(k)) * 80, op: Math.min(1, k * 3), blur: (1 - eo(k)) * 10 }); });
    const tk = eo(p(t, 54.1, 54.7));
    tf($("#e-tag", root), { y: (1 - tk) * 30, op: tk });
    $("#e-stack", root).style.opacity = p(t, 54.8, 55.4);
    $("#e-black", root).style.opacity = eio(p(t, 58.4, 59.6));
  });
}

// ═══ global: shake, flash, grain, HUD ════════════════════════════════════════
const SHAKES = [[0.5, 9], [1.75, 9], [3.0, 7], [5.0, 16], [9.0, 10], [39.0, 7], [43.0, 5], [53.0, 16]];
const FLASHES = [[5.0, 0.85], [42.0, 0.7], [53.0, 1]];
const CHAPTERS = [[9, "01 Matching"], [17, "02 Dashboard"], [20, "03 Discover"], [23, "04 Collaborations"], [29, "05 Messages"], [37, "06 Calls"], [42, "07 Themes"], [45, "08 Mobile"], [49, "09 Stack"]];
const LIGHT_SPANS = [[17, 29], [42, 43.6]];

const grain = $("#grain"), gctx = grain.getContext("2d");
const tiles = [];
for (let k = 0; k < 6; k++) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 256;
  const x = c.getContext("2d"), d = x.createImageData(256, 256), r = mulberry32(k + 1);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); tiles.push(c);
}

function seek(t) {
  cursorState = null;
  for (const sc of scenes) {
    const on = t >= sc.start && t < sc.end;
    sc.el.style.display = on ? "block" : "none";
    if (on) sc.update(t - sc.start, t, sc.el);
  }
  let sx = 0, sy = 0;
  for (const [ti, a] of SHAKES) if (t >= ti && t < ti + 0.6) { const d = Math.exp(-(t - ti) * 9) * a; const f = Math.floor(t * 60); sx += (hash(f) - 0.5) * 2 * d; sy += (hash(f + 77) - 0.5) * 2 * d; }
  cam.style.transform = `translate(${sx}px,${sy}px)`;
  let fl = 0;
  for (const [ti, a] of FLASHES) if (t >= ti) fl = Math.max(fl, a * Math.exp(-(t - ti) * 7));
  $("#flash").style.opacity = fl;
  const f = Math.floor(t * 30);
  const tile = tiles[f % tiles.length];
  gctx.save(); gctx.translate(-(hash(f) * 256) | 0, -(hash(f + 1) * 256) | 0);
  for (let x = 0; x < 960 + 256; x += 256) for (let y = 0; y < 540 + 256; y += 256) gctx.drawImage(tile, x, y);
  gctx.restore();
  const hud = $("#hud");
  hud.style.opacity = 0.55 * p(t, 9.5, 10) * (1 - p(t, 52.6, 53));
  const light = LIGHT_SPANS.some(([a, b]) => t >= a && t < b);
  hud.style.color = light ? INK : PAPER;
  const ch = CHAPTERS.filter(([a]) => t >= a).pop();
  $("#hud-bl").textContent = ch ? ch[1] : "";
  const fr = Math.floor(t * 30) % 30, s = Math.floor(t);
  $("#hud-tr").textContent = `00:${String(s).padStart(2, "0")}:${String(fr).padStart(2, "0")}`;
  if (cursorState) {
    cursorEl.style.display = "block";
    cursorEl.style.transform = `translate(${cursorState.x - 8}px,${cursorState.y - 4}px) scale(${cursorState.down ? 0.85 : 1})`;
  } else cursorEl.style.display = "none";
}
window.seek = seek;
window.DUR = DUR;

window.ready = (async () => {
  await document.fonts.load("700 100px Brico"); await document.fonts.load("400 20px Plex"); await document.fonts.load("500 20px Plex"); await document.fonts.load("600 20px Plex");
  await document.fonts.load("400 20px Mono"); await document.fonts.load("500 20px Mono");
  await Promise.all($$("img").map((i) => i.decode().catch(() => {})));
  // show every scene once so layout (offsets) exists
  seek(0);
  return true;
})();

// ── preview mode ──
const params = new URLSearchParams(location.search);
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); const w = $("#wrap"); w.style.transform = `scale(${s})`; w.style.left = `${(innerWidth - 1920 * s) / 2}px`; w.style.top = `${(innerHeight - 1080 * s) / 2}px`; }
if (!params.has("render")) {
  addEventListener("resize", fit); fit();
  const audio = new Audio("trailer-audio.wav");
  const play = $("#play"); play.style.display = "flex";
  let t0 = null;
  const startAt = Number(params.get("t") || 0);
  window.ready.then(() => seek(startAt));
  play.onclick = () => {
    play.style.display = "none";
    audio.currentTime = startAt; audio.play().catch(() => {});
    t0 = performance.now() - startAt * 1000;
    const loop = () => { const t = audio.paused || audio.error ? (performance.now() - t0) / 1000 : audio.currentTime; seek(Math.min(t, DUR - 0.001)); if (t < DUR) requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  };
}
